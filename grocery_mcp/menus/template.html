<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>__TITLE__</title>
<style>
__FONT_CSS__
@page { __PAGE_SIZE__ margin: 0; }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: #f4efe6; color: #1c1915; }
.sheet {
  __SHEET_SIZE__
  padding: 0.36in 0.4in 0.72in;
  display: flex;
  flex-direction: column;
  break-after: page;
  page-break-after: always;
  position: relative;
  overflow: hidden;
  background:
    radial-gradient(circle at 100% 0, rgba(196, 122, 44, 0.16), transparent 28%),
    #f4efe6;
}
.sheet:last-child { break-after: auto; page-break-after: auto; }
header { margin-bottom: 0.14in; }
h1 {
  margin: 0;
  font-family: Fraunces, Georgia, serif;
  font-weight: 700;
  font-size: 28px;
  line-height: 1.05;
  letter-spacing: -0.03em;
  overflow-wrap: anywhere;
}
h2 { overflow-wrap: anywhere; }
.subtitle {
  margin: 0.04in 0 0;
  font-family: "DM Sans", sans-serif;
  font-size: 12px;
  line-height: 1.3;
  color: #5c5348;
}
.columns {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 0.16in;
}
.day {
  min-width: 0;
  min-height: 0;
  border-top: 2px solid #1c1915;
  padding-top: 0.08in;
}
.day-empty { border-top-color: transparent; }
.day h2 {
  margin: 0 0 0.08in;
  font-family: "DM Sans", sans-serif;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}
.meal { margin: 0 0 0.1in; }
.meal:last-child { margin-bottom: 0; }
.course {
  margin: 0;
  font-family: "DM Sans", sans-serif;
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #9a4e12;
}
.name {
  margin: 0.02in 0 0;
  font-family: Fraunces, Georgia, serif;
  font-weight: 500;
  font-size: 15px;
  line-height: 1.15;
  overflow-wrap: anywhere;
}
.desc {
  margin: 0.03in 0 0;
  font-family: "DM Sans", sans-serif;
  font-size: 11px;
  line-height: 1.3;
  color: #3d3832;
  overflow-wrap: anywhere;
}
.shop {
  position: absolute;
  left: 0.4in;
  right: 0.4in;
  bottom: 0.14in;
  height: 0.48in;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.2in;
  border-top: 1px solid #d9d0c3;
}
.shop a {
  font-family: "DM Sans", sans-serif;
  font-size: 12px;
  font-weight: 600;
  color: #1c1915;
  text-decoration: none;
  min-width: 0;
}
.shop .open {
  display: block;
  color: #9a4e12;
  text-decoration: underline;
}
.shop small {
  display: block;
  font-size: 9px;
  font-weight: 400;
  letter-spacing: 0.04em;
  color: #5c5348;
}
.qr { width: 0.38in; height: 0.38in; }
.qr svg { display: block; width: 0.38in; height: 0.38in; }
</style>
</head>
<body>
__SHEETS__
</body>
</html>
