<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>__TITLE__</title>
<style>
__FONT_CSS__
@page { __PAGE_SIZE__ margin: 0; }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: #f7f3ec; color: #1c1714; }
.sheet {
  __SHEET_SIZE__
  padding: 0.42in 0.48in 0.86in;
  display: flex;
  flex-direction: column;
  break-after: page;
  page-break-after: always;
  position: relative;
  overflow: hidden;
  background: #f7f3ec;
}
.sheet:last-child { break-after: auto; page-break-after: auto; }
header {
  margin-bottom: 0.18in;
  padding-bottom: 0.1in;
  border-bottom: 1px solid #1c1714;
}
h1 {
  margin: 0;
  font-family: Fraunces, Georgia, serif;
  font-weight: 500;
  font-size: 30px;
  line-height: 1.02;
  letter-spacing: -0.03em;
  overflow-wrap: anywhere;
}
h2 { overflow-wrap: anywhere; }
.subtitle {
  margin: 0.05in 0 0;
  font-family: "DM Sans", sans-serif;
  font-size: 11px;
  line-height: 1.35;
  letter-spacing: 0.01em;
  color: #5e564e;
}
.columns {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 0.16in;
}
.day {
  min-width: 0;
  min-height: 0;
}
.day h2 {
  margin: 0 0 0.1in;
  padding-bottom: 0.05in;
  border-bottom: 1px solid #cfc6ba;
  font-family: "DM Sans", sans-serif;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.18em;
  text-transform: uppercase;
}
.meal { margin: 0 0 0.1in; }
.meal:last-child { margin-bottom: 0; }
.course {
  margin: 0;
  font-family: "DM Sans", sans-serif;
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #6e3b24;
}
.name {
  margin: 0.03in 0 0;
  font-family: Fraunces, Georgia, serif;
  font-weight: 500;
  font-size: 16px;
  line-height: 1.15;
  overflow-wrap: anywhere;
}
.desc {
  margin: 0.04in 0 0;
  font-family: "DM Sans", sans-serif;
  font-size: 11px;
  line-height: 1.35;
  color: #3f3832;
  overflow-wrap: anywhere;
}
.shop {
  position: absolute;
  left: 0.48in;
  right: 0.48in;
  bottom: 0.2in;
  height: 0.52in;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 0.18in;
  border-top: 1px solid #1c1714;
  padding-top: 0.08in;
}
.shop a.cart-url {
  flex: 1;
  min-width: 0;
  color: inherit;
  text-decoration: none;
}
.shop .open {
  display: block;
  font-family: Fraunces, Georgia, serif;
  font-weight: 500;
  font-size: 13px;
  line-height: 1.1;
  color: #1c1714;
}
.shop .address {
  display: block;
  margin-top: 0.04in;
  font-family: "DM Sans", sans-serif;
  font-size: 8px;
  line-height: 1.25;
  color: #6e3b24;
  text-decoration: underline;
  text-underline-offset: 2px;
  overflow-wrap: anywhere;
}
.shop .meta {
  margin: 0 0 0.02in;
  font-family: "DM Sans", sans-serif;
  font-size: 8px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #6d645b;
  white-space: nowrap;
}
.qr { width: 0.4in; height: 0.4in; flex: none; }
.qr svg { display: block; width: 0.4in; height: 0.4in; }
</style>
</head>
<body>
__SHEETS__
</body>
</html>
