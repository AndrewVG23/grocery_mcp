[project]
name = "grocery-mcp"
version = "0.1.0"
description = "Direct grocery storefront search and pickup handoff over MCP and REST"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "fastmcp>=2.0,<3",
    "httpx>=0.27,<1",
    "pydantic>=2.9,<3",
    "rapidfuzz>=3.9,<4",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "respx>=0.21,<1",
    "ruff>=0.6",
]

[project.scripts]
grocery-mcp = "grocery_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["grocery_mcp*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
